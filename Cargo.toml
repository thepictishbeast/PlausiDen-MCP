[package]
name = "plausiden-mcp"
version = "0.1.0"
edition = "2024"
license = "BSL-1.1"
description = "Model Context Protocol server for the PlausiDen ecosystem"
repository = "https://github.com/redcaptian1917/PlausiDen-MCP"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }

anyhow = "1"

# MCP protocol
async-trait = "0.1"

# PlausiDen crates (will be path deps during development)
# engine-core = { path = "../PlausiDen-Engine/engine-core" }
# engine-browser = { path = "../PlausiDen-Engine/engine-browser" }
